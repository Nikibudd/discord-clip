# Reusable: tests, builds and packages Discord Clip, and optionally publishes
# a GitHub release. Called by ci.yml (every push) and release.yml (merged PRs
# into main).
#
# The version is stamped into Cargo.toml/Cargo.lock for the build only (never
# committed), so the exe reports it through CARGO_PKG_VERSION.
#
# Outputs (in dist/, uploaded as an artifact):
#   discord-clip-<version>-setup.exe     installer (per-user, no admin)
#   discord-clip-<version>-portable.exe  standalone exe
#   latest.json                          update manifest the app can poll
#   SHA256SUMS.txt

name: build

on:
  workflow_call:
    inputs:
      version:
        description: Release version (X.Y.Z or X.Y.Z-pre). Empty = dev build.
        type: string
        default: ''
      ref:
        description: Commit to build. Empty = the triggering commit.
        type: string
        default: ''
      publish:
        description: Publish a GitHub release vVERSION at `ref`.
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Stamp version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $v = $env:RELEASE_VERSION
          if (-not $v) {
            $base = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
            $sha = (git rev-parse --short=7 HEAD).Trim()
            $v = "$($base.Split('-')[0])-dev.g$sha"
          }
          $toml = Get-Content Cargo.toml -Raw
          $toml = ([regex]'(?m)^version = "[^"]*"').Replace($toml, "version = `"$v`"", 1)
          Set-Content Cargo.toml $toml -NoNewline -Encoding utf8NoBOM
          $lock = Get-Content Cargo.lock -Raw
          $lock = ([regex]'(name = "discord-clip"\r?\nversion = )"[^"]*"').Replace($lock, '${1}"' + $v + '"', 1)
          Set-Content Cargo.lock $lock -NoNewline -Encoding utf8NoBOM

          $check = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($check -ne $v) { throw "Couldn't stamp version $v (Cargo.toml says $check)" }
          "version=$v"                      >> $env:GITHUB_OUTPUT
          "numeric=$($v.Split('-')[0])"     >> $env:GITHUB_OUTPUT
          "prerelease=$($v.Contains('-'))"  >> $env:GITHUB_OUTPUT
          "sha=$((git rev-parse HEAD).Trim())" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v"

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Couldn't install Inno Setup" }
          }
          $v = '${{ steps.version.outputs.version }}'
          & $iscc /Q `
            "/DAppVersion=$v" `
            "/DNumericVersion=${{ steps.version.outputs.numeric }}" `
            "/DOutputName=discord-clip-$v-setup" `
            "/DSourceExe=..\target\release\discord-clip.exe" `
            installer\discord-clip.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Package
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $repo = '${{ github.repository }}'
          $tag = "v$v"
          $setup = "discord-clip-$v-setup.exe"
          $portable = "discord-clip-$v-portable.exe"
          Copy-Item target\release\discord-clip.exe "dist\$portable"

          $base = "https://github.com/$repo/releases/download/$tag"
          function Asset($name) {
            $file = Get-Item "dist\$name"
            [ordered]@{
              name   = $name
              url    = "$base/$name"
              size   = $file.Length
              sha256 = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            }
          }
          # Update manifest. Keep the shape stable (bump "schema" on breaking
          # changes): released apps read it.
          $manifest = [ordered]@{
            schema      = 1
            version     = $v
            tag         = $tag
            published   = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            notes_url   = "https://github.com/$repo/releases/tag/$tag"
            min_windows = '10.0.19041'
            installer   = Asset $setup
            portable    = Asset $portable
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content dist\latest.json -Encoding utf8NoBOM

          Get-ChildItem dist\*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt -Encoding utf8NoBOM

          Get-Content dist\latest.json
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: discord-clip-${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/latest.json
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $flags = @('--title', "Discord Clip $v", '--generate-notes', '--target', '${{ steps.version.outputs.sha }}')
          if ('${{ steps.version.outputs.prerelease }}' -eq 'True') { $flags += '--prerelease' }
          gh release create "v$v" @flags `
            "dist\discord-clip-$v-setup.exe" `
            "dist\discord-clip-$v-portable.exe" `
            dist\latest.json `
            dist\SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
